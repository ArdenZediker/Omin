name: macOS build

on:
  push:
    branches: [main, "PENGY/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: apple-silicon
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build macOS DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --ci --target ${{ matrix.target }} --bundles dmg
      - name: Verify packaged app
        run: |
          set -euo pipefail
          dmg=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#dmg[@]}" -eq 1
          mountpoint="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mountpoint" -quiet || true
            rmdir "$mountpoint" || true
          }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" "${dmg[0]}" -quiet
          app=("$mountpoint"/*.app)
          test "${#app[@]}" -eq 1
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app[0]}/Contents/Info.plist")"
          archs="$(lipo -archs "${app[0]}/Contents/MacOS/$executable")"
          if [[ "${{ matrix.target }}" == aarch64-* ]]; then expected=arm64; else expected=x86_64; fi
          test "$archs" = "$expected"
          codesign --verify --deep --strict --verbose=2 "${app[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: omni-macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
