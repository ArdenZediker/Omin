name: macOS build

on:
  push:
    branches: [main, "PENGY/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: apple-silicon
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm exec tsc --noEmit
      - name: Run frontend tests
        run: pnpm test
      # tauri-build validates externalBin during cargo test, before Tauri's
      # normal beforeBuildCommand runs. Build the host-native sidecar first.
      - name: Build Agent Host sidecar
        run: node scripts/build-agent-host.mjs --target ${{ matrix.target }}
      - name: Run Rust library tests
        working-directory: src-tauri
        env:
          CARGO_TERM_COLOR: never
          CARGO_TERM_PROGRESS_WHEN: never
        run: |
          set -o pipefail
          cargo test --lib 2>&1 | tee rust-test.log
      - name: Annotate Rust test failure
        if: failure()
        working-directory: src-tauri
        run: |
          test -f rust-test.log || exit 0
          sed $'s/\x1b\\[[0-9;]*[[:alpha:]]//g' rust-test.log > rust-test.clean.log
          {
            echo "=== cargo/rust errors ==="
            grep -n -E -B 4 -A 20 \
              '(^|[[:space:]])error(\[E[0-9]+\])?:|warning: unused|test result: FAILED|panicked at|failed to run custom build command|linker command failed|undefined reference|fatal error:|failed to download|failed to authenticate|network failure|operation timed out' \
              rust-test.clean.log || true
            echo "=== final output ==="
            tail -60 rust-test.clean.log
          } > rust-test-diagnostic.log 2>&1
          split -b 3000 rust-test-diagnostic.log rust-test-diagnostic-chunk-
          index=1
          for chunk in rust-test-diagnostic-chunk-*; do
            test "$index" -le 8 || break
            encoded="$(base64 < "$chunk" | tr -d '\n')"
            echo "::error title=Rust test diagnostic chunk $index::$encoded"
            index=$((index + 1))
          done
      - name: Upload Rust test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: omni-macos-${{ matrix.arch }}-rust-test-log
          path: src-tauri/rust-test.log
          if-no-files-found: ignore
      - name: Run macOS Seatbelt sandbox tests
        working-directory: src-tauri
        run: cargo test --lib sandbox::tests::macos_ -- --test-threads=1
      - name: Build frontend
        run: pnpm build
      - name: Build macOS DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --ci --target ${{ matrix.target }} --bundles dmg
      - name: Verify packaged app
        run: |
          set -euo pipefail
          dmg=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#dmg[@]}" -eq 1
          mountpoint="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mountpoint" -quiet || true
            rmdir "$mountpoint" || true
          }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" "${dmg[0]}" -quiet
          app=("$mountpoint"/*.app)
          test "${#app[@]}" -eq 1
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app[0]}/Contents/Info.plist")"
          archs="$(lipo -archs "${app[0]}/Contents/MacOS/$executable")"
          if [[ "${{ matrix.target }}" == aarch64-* ]]; then expected=arm64; else expected=x86_64; fi
          test "$archs" = "$expected"
          codesign --verify --deep --strict --verbose=2 "${app[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: omni-macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
